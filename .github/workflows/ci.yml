name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    # Building an iOS app needs Xcode, which only the macOS runners have.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Pick an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "Using simulator $device"
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"

      - name: Test
        run: |
          xcodebuild test -quiet \
            -project BrickPick.xcodeproj \
            -scheme BrickPick \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
